[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bsplus"
version = "0.2.0"
description = "Black-Scholes and beyond: Greeks, robust implied vol, American trees, barriers, Heston, SVI/SSVI and local vol, validated on real SPY data"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
data = ["pandas>=2.0", "yfinance>=0.2.40"]
app = ["bsplus[data]", "streamlit>=1.35", "plotly>=5.20"]
examples = ["bsplus[data]", "matplotlib>=3.7"]
dev = ["bsplus[app,examples]", "pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"app/dashboard.py" = ["E402"]  # imports follow the sys.path bootstrap
"examples/*.py" = ["E501"]  # long lines are a Markdown report template
