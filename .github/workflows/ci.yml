name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[app,dev]"
      - name: Lint
        run: ruff check src tests app
      - name: Test
        run: pytest -q
      - name: Dashboard smoke test
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file("app/dashboard.py", default_timeout=180)
          at.run()
          assert not at.exception, at.exception
          [b for b in at.button if "Calibrate" in b.label][0].click().run()
          assert not at.exception, at.exception
          print("dashboard OK")
          PY
