name: release

# Publishes to PyPI when a GitHub release is published, using PyPI trusted
# publishing (no API token stored in the repo). One-time setup on pypi.org:
# Account -> Publishing -> add a "pending publisher" for project "bsplus",
# owner Samarty-1, repository black-scholes-plus, workflow release.yml,
# environment pypi.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test before publishing
        run: |
          pip install -e ".[dev]"
          pytest -q
      - name: Build and check distributions
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/bsplus/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
